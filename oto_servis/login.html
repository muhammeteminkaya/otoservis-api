<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oto Servis - Sisteme Giriş</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #334155; }
        .login-card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 400px; 
            border-top: 5px solid #38bdf8;
        }
        h2 { text-align: center; margin-bottom: 24px; color: #0f172a; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 1rem; 
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px; 
            transition: 0.2s;
        }
        button:hover { background: #0284c7; color: white; }
        #hataMesaji { 
            color: #ef4444; 
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
            text-align: center; 
            margin-top: 15px; 
            display: none; 
            font-size: 0.9rem; 
            font-weight: bold;
        }
    </style>
</head>
<body>
<a href="index.html" style="position: absolute; top: 20px; left: 20px; background-color: #1e293b; color: #f8fafc; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s;">
    ⬅ Ana Sayfaya Dön
</a>

    <div class="login-card">
        <h2>🛠️ Servis Otomasyonu</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="kullanici_adi" placeholder="Örn: usta, cirak, depo" required>
            </div>
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" id="sifre" placeholder="Şifrenizi girin" required>
            </div>
            <button type="submit">Sisteme Giriş Yap</button>
        </form>
        <div id="hataMesaji">Hatalı kullanıcı adı veya şifre!</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Sayfanın yenilenmesini engelle
            
            const kadi = document.getElementById('kullanici_adi').value.trim();
            const sifre = document.getElementById('sifre').value.trim();
            const hata = document.getElementById('hataMesaji');
            
            hata.style.display = 'none';

            try {
                // API'ye giriş isteği atıyoruz
                const response = await fetch('https://otoservis-api-4ta4.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kullanici_adi: kadi, sifre: sifre })
                });

                if (!response.ok) throw new Error("Giriş başarısız");

                const data = await response.json();
                
                // Hangi kullanıcının girdiğini tarayıcı hafızasına (localStorage) kaydediyoruz
                localStorage.setItem('aktifKullanici', data.kullanici_adi);
                localStorage.setItem('kullaniciRolu', data.rol);

               // Gelen role göre ilgili sayfaya yönlendiriyoruz
                if (data.rol === 'usta') {
                    window.location.href = 'usta.html';
                } else if (data.rol === 'cirak') {
                    window.location.href = 'cirak.html';
                } else if (data.rol === 'depo') {
                    window.location.href = 'depo.html';
                } else if (data.rol === 'muhasebe') {
                    window.location.href = 'muhasebe.html'; // MUHASEBE EKLENDİ
                }

            } catch (err) {
                hata.style.display = 'block';
            }
        });
    </script>

</body>
</html>
