<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usta Paneli - Araç Kabul</title>
    <!-- PWA Bağlantıları -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb" id="theme-color-meta">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <style>
        /* TEMEL DEĞİŞKENLER VE AÇIK TEMA (LIGHT MODE) */
        :root {
            --bg-body: #f8fafc;
            --bg-container: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --header-bg: #2563eb;
            --input-bg: #ffffff;
            --parca-bg: #f1f5f9;
            --gecmis-bg: #e0f2fe;
            --gecmis-text: #0369a1;
        }

        /* KARANLIK TEMA (DARK MODE) */
        body.dark-mode {
            --bg-body: #0f172a;
            --bg-container: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --header-bg: #020617;
            --input-bg: #0f172a;
            --parca-bg: #0f172a;
            --gecmis-bg: rgba(14, 165, 233, 0.1);
            --gecmis-text: #38bdf8;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-body); padding: 20px; color: var(--text-main); transition: background-color 0.3s ease; }
        
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--header-bg); color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; transition: background-color 0.3s ease;
        }
        
        .header-sag { display: flex; gap: 10px; align-items: center; }
        
        /* Tema Butonu */
        .tema-btn { background: transparent; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        .tema-btn:hover { background: rgba(255,255,255,0.2); }
        
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .container { max-width: 600px; margin: 0 auto; background: var(--bg-container); padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: background-color 0.3s ease; }
        h2 { margin-bottom: 20px; color: #3b82f6; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 120px; }
        .input-group { flex: 1; min-width: 200px; margin-bottom: 15px; }
        
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; outline: none; background: var(--input-bg); color: var(--text-main); }
        input:focus, textarea:focus { border-color: #3b82f6; }
        
        .parca-ekle-alani { background: var(--parca-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .parca-input-row { display: flex; gap: 10px; }
        .btn-ekle { background: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; min-width: 80px; }
        
        #parcaListesi { list-style: none; margin-top: 10px; }
        #parcaListesi li { background: var(--bg-container); padding: 8px 10px; margin-bottom: 5px; border-radius: 4px; border-left: 4px solid #10b981; border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; color: var(--text-main); }
        .sil-btn { color: #ef4444; cursor: pointer; font-weight: bold; padding: 0 5px; }

        .btn-kaydet { width: 100%; padding: 15px; background: #2563eb; color: white; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
        .btn-kaydet:hover { background: #1d4ed8; }
        
        #gecmisBilgisi { display: none; background: var(--gecmis-bg); padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; color: var(--gecmis-text); border-left: 4px solid #0ea5e9; }
        #mesajKutusu { display: none; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <div class="header" style="max-width: 600px; margin: 0 auto 20px auto;">
        <div>👤 Hoş Geldin, <span id="kullaniciAdiDisplay">Usta</span></div>
        <div class="header-sag">
            <button class="tema-btn" onclick="temaDegistir()" id="temaIkonu">🌙</button>
            <button class="logout-btn" onclick="cikisYap()">Çıkış Yap</button>
        </div>
    </div>

    <!-- Ana Form -->
    <div class="container">
        <h2>🛠️ Yeni İş Emri Oluştur</h2>
        
        <form id="ustaForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Plaka</label>
                    <input type="text" id="plaka" placeholder="Örn: 34ABC123" required style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label>Marka</label>
                    <input type="text" id="markaModel" placeholder="Örn: Ford Focus" required>
                </div>
                <div class="form-group">
                    <label>Yıl</label>
                    <input type="number" id="yil" placeholder="2020" required>
                </div>
            </div>
            
            <div class="input-group">
                <label>MÜŞTERİ TELEFONU (Başında 0 olmadan)</label>
                <input type="text" id="telefon" placeholder="5551234567" maxlength="10">
            </div>

            <!-- Geçmiş Servis Kayıtları Bilgi Kutusu -->
            <div id="gecmisBilgisi">
                <!-- JavaScript ile buraya veriler dolacak -->
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Usta Notu (İsteğe Bağlı)</label>
                <textarea id="ustaNotu" rows="3" placeholder="Örn: Müşteri rölanti dalgalanmasından şikayetçi..."></textarea>
            </div>

            <!-- Çırak İçin Parça İsteme Bölümü -->
            <div class="parca-ekle-alani">
                <label>🛠️ Çıraktan İstenecek Parçalar</label>
                <div class="parca-input-row">
                    <input type="text" id="yeniParca" placeholder="Örn: Yağ Filtresi">
                    <button type="button" class="btn-ekle" onclick="listeyeParcaEkle()">+ Ekle</button>
                </div>
                <ul id="parcaListesi"></ul>
            </div>

            <button type="submit" class="btn-kaydet">Sisteme Kaydet ve Çırağa Bildir</button>
        </form>
        
        <div id="mesajKutusu"></div>
    </div>

    <script>
        // 1. TEMA (DARK MODE) YÖNETİMİ
        const body = document.body;
        const temaIkonu = document.getElementById('temaIkonu');
        const themeMeta = document.getElementById('theme-color-meta');

        if (localStorage.getItem('tema') === 'karanlik') {
            body.classList.add('dark-mode');
            temaIkonu.innerText = '☀️';
            themeMeta.setAttribute('content', '#020617');
        }

        function temaDegistir() {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('tema', 'karanlik');
                temaIkonu.innerText = '☀️';
                themeMeta.setAttribute('content', '#020617');
            } else {
                localStorage.setItem('tema', 'aydinlik');
                temaIkonu.innerText = '🌙';
                themeMeta.setAttribute('content', '#2563eb');
            }
        }

        // 2. GÜVENLİK KONTROLÜ
        if (localStorage.getItem('kullaniciRolu') !== 'usta') {
            alert("Bu sayfaya erişim yetkiniz yok! Lütfen giriş yapın.");
            window.location.href = 'login.html';
        }
        
        document.getElementById('kullaniciAdiDisplay').innerText = (localStorage.getItem('aktifKullanici') || 'Usta').toUpperCase();

        function cikisYap() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // 3. PARÇA LİSTESİ YÖNETİMİ
        let alinacakParcalar = [];

        function listeyeParcaEkle() {
            const parcaInput = document.getElementById('yeniParca');
            const parcaAdi = parcaInput.value.trim();
            
            if (parcaAdi !== "") {
                alinacakParcalar.push({ alinacak_parca: parcaAdi });
                arayuzuGuncelle();
                parcaInput.value = ""; 
                parcaInput.focus();
            }
        }

        function parcayiSil(index) {
            alinacakParcalar.splice(index, 1);
            arayuzuGuncelle();
        }

        function arayuzuGuncelle() {
            const liste = document.getElementById('parcaListesi');
            liste.innerHTML = "";
            alinacakParcalar.forEach((p, index) => {
                liste.innerHTML += `<li>${p.alinacak_parca} <span class="sil-btn" onclick="parcayiSil(${index})">X</span></li>`;
            });
        }
		
        // 4. PLAKA GİRİLDİĞİNDE GEÇMİŞ BİLGİSİ SORGULAMA
		document.getElementById('plaka').addEventListener('blur', async (e) => {
            const plaka = e.target.value.trim().toUpperCase();
            const gecmisKutusu = document.getElementById('gecmisBilgisi');
            
            if (plaka.length < 5) {
                gecmisKutusu.style.display = 'none';
                return;
            }

            try {
                const res = await fetch(`https://otoservis-api-4ta4.onrender.com/usta/arac-gecmisi/${plaka}`);
                const gecmis = await res.json();

                if (gecmis && gecmis.length > 0) {
                    let html = `<strong>📜 ${plaka} Geçmiş Servis Kayıtları:</strong><ul style="margin-top: 5px; padding-left: 20px;">`;
                    gecmis.forEach(kayit => {
                        const tarih = new Date(kayit.kayit_tarihi).toLocaleDateString('tr-TR');
                        html += `<li><strong>${tarih}:</strong> ${kayit.usta_notu || 'Not girilmemiş'} (Tutar: ${kayit.toplam_tutar} TL)</li>`;
                    });
                    html += "</ul>";
                    gecmisKutusu.innerHTML = html;
                    gecmisKutusu.style.display = 'block';
                } else {
                    gecmisKutusu.innerHTML = `✨ <strong>${plaka}</strong> plakalı araç servisimize ilk defa geliyor.`;
                    gecmisKutusu.style.display = 'block';
                }
            } catch (err) {
                console.log("Geçmiş sorgulanamadı.");
            }
        });

        // 5. FORMU BACKEND'E GÖNDERME
        document.getElementById('ustaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mesaj = document.getElementById('mesajKutusu');
            
            const veri = {
                plaka: document.getElementById('plaka').value.trim().toUpperCase(),
                marka_model: document.getElementById('markaModel').value.trim(),
                yil: parseInt(document.getElementById('yil').value),
				telefon : document.getElementById('telefon').value.trim(),
                usta_notu: document.getElementById('ustaNotu').value.trim(),
                alinacak_parcalar: alinacakParcalar
            };

            try {
                const res = await fetch('https://otoservis-api-4ta4.onrender.com/usta/is-emri-olustur', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(veri)
                });

                if (!res.ok) throw new Error("İş emri oluşturulamadı!");

                mesaj.style.display = 'block';
                mesaj.style.background = '#dcfce7';
                mesaj.style.color = '#15803d';
                mesaj.innerText = "✓ İş emri başarıyla oluşturuldu ve çırağa iletildi!";

                // Formu sıfırla
                document.getElementById('ustaForm').reset();
                alinacakParcalar = [];
                arayuzuGuncelle();
                document.getElementById('gecmisBilgisi').style.display = 'none';

                setTimeout(() => { mesaj.style.display = 'none'; }, 4000);

            } catch (err) {
                mesaj.style.display = 'block';
                mesaj.style.background = '#fee2e2';
                mesaj.style.color = '#b91c1c';
                mesaj.innerText = "Hata: Sunucuya bağlanılamadı.";
            }
        });
    </script>
</body>
</html>
