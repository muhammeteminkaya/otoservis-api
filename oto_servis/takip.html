<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oto Servis Araç Takip Sistemi</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #38bdf8;
            font-size: 1.5rem;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            text-transform: uppercase;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 12px 20px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        .result-card {
            display: none;
            background: #0f172a;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #38bdf8;
            margin-top: 15px;
        }
        .result-item {
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .label {
            color: #94a3b8;
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .value {
            font-weight: 600;
            color: #f1f5f9;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 4px;
        }
        .status-Bekliyor { background: #eab308; color: #000; }
        .status-İşlemde { background: #3b82f6; color: #fff; }
        .status-ParçaBekliyor { background: #f97316; color: #fff; }
        .status-Tamamlandı { background: #22c55e; color: #fff; }
        .error-msg {
            color: #ef4444;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
<a href="index.html" style="position: absolute; top: 20px; left: 20px; background-color: #1e293b; color: #f8fafc; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s;">
    ⬅ Ana Sayfaya Dön
</a>

<div class="container">
    <h2>🚗 Servis Durum Takip</h2>
    
    <div class="form-group">
        <input type="text" id="plakaInput" placeholder="Plaka girin (örn: 34TK999)">
        <button onclick="aracSorgula()">Sorgula</button>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <div id="resultCard" class="result-card">
        <div class="result-item">
            <span class="label">Plaka</span>
            <span id="resPlaka" class="value"></span>
        </div>
        <div class="result-item">
            <span class="label">Yapılan İşlem</span>
            <span id="resIslem" class="value"></span>
        </div>
        <div class="result-item">
            <span class="label">Onarım Durumu</span>
            <span id="resDurumBadge" class="status-badge"></span>
        </div>
        <div class="result-item">
            <span class="label">Toplam Tutar</span>
            <span id="resTutar" class="value"></span>
        </div>
    </div>
</div>

<script>
    async function aracSorgula() {
        const plaka = document.getElementById('plakaInput').value.trim().toUpperCase();
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');

        errorMsg.style.display = 'none';
        resultCard.style.display = 'none';

        if (!plaka) {
            errorMsg.innerText = "Lütfen bir plaka girin.";
            errorMsg.style.display = 'block';
            return;
        }

        try {
            // Port 8080'de çalışan FastAPI sunucumuza istek atıyoruz
            const response = await fetch(`https://otoservis-api-4ta4.onrender.com/arac-durumu/${encodeURIComponent(plaka)}`);

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.detail || "Kayıt bulunamadı.");
            }

            const data = await response.json();

            // Gelen verileri ekrana yerleştiriyoruz
            document.getElementById('resPlaka').innerText = data.plaka;
            document.getElementById('resIslem').innerText = data.islem;
            document.getElementById('resTutar').innerText = data.tutar + " ₺";

            const badge = document.getElementById('resDurumBadge');
            badge.innerText = data.durum;
            // Boşlukları temizleyerek CSS class'ına çeviriyoruz (örn: Parça Bekliyor -> ParçaBekliyor)
            const cleanStatus = data.durum.replace(/\s+/g, '');
            badge.className = `status-badge status-${cleanStatus}`;

            resultCard.style.display = 'block';

        } catch (err) {
            errorMsg.innerText = err.message;
            errorMsg.style.display = 'block';
        }
    }
</script>

</body>
</html>
