<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oto Servis - Hoş Geldiniz</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { 
            background-color: #0f172a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #f8fafc; 
        }
        .container { text-align: center; padding: 20px; }
        h1 { margin-bottom: 10px; color: #38bdf8; font-size: 2.5rem; }
        p.subtitle { color: #94a3b8; margin-bottom: 40px; font-size: 1.1rem; }
        
        .options-wrapper { 
            display: flex; 
            gap: 30px; 
            justify-content: center; 
            flex-wrap: wrap;
        }
        
        .card { 
            background: #1e293b; 
            padding: 40px 30px; 
            border-radius: 16px; 
            width: 280px; 
            text-decoration: none; 
            color: white; 
            border: 2px solid #334155; 
            transition: all 0.3s ease; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .card:hover { 
            border-color: #38bdf8; 
            transform: translateY(-8px); 
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.2);
        }
        
        .icon { font-size: 4.5rem; margin-bottom: 20px; }
        .title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .desc { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; }

        /* Müşteri kartı hover rengi farklı olsun */
        .card.musteri:hover {
            border-color: #10b981;
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Oto Servis Yönetim Sistemi</h1>
        <p class="subtitle">Lütfen giriş yapmak istediğiniz paneli seçin</p>
        
        <div class="options-wrapper">
            <!-- Müşteri Seçeneği -->
            <a href="takip.html" class="card musteri">
                <div class="icon">🚗</div>
                <div class="title">Müşteri Girişi</div>
                <div class="desc">Aracınızın güncel onarım durumunu ve hesap detaylarını plakanızla anında sorgulayın.</div>
            </a>

            <!-- Servis / Personel Seçeneği -->
            <a href="login.html" class="card">
                <div class="icon">🛠️</div>
                <div class="title">Servis Girişi</div>
                <div class="desc">Usta, Çırak, Depo ve Muhasebe personeli için yetkilendirilmiş yönetim paneli.</div>
            </a>
        </div>
    </div>

</body>
</html>
